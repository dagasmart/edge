# /etc/nginx/conf.d/edge-auth-upstream.conf
# EdgeAuth Swow 集群 upstream
upstream edge_auth_backend {
    least_conn;
    server 127.0.0.1:9503 max_fails=3 fail_timeout=5s;
    server 127.0.0.1:9504 max_fails=3 fail_timeout=5s;
    server 127.0.0.1:9505 max_fails=3 fail_timeout=5s;
    server 127.0.0.1:9506 max_fails=3 fail_timeout=5s;

    # 开启 keepalive 到上游（减少 TCP 握手开销）
    keepalive 128;
}

server {
    listen 80;
    server_name ccs.dagasmart.com;

    # 限流：单 IP 每秒 100 个请求（防止打穿）
    limit_req_zone $binary_remote_addr zone=edge_auth_limit:10m rate=100r/s;
    limit_req zone=edge_auth_limit burst=200 nodelay;

    location /mqtt/auth {
        # 透传真实 IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        # 关闭 Nginx 自己的缓冲，让 Swow 直接处理
        proxy_buffering off;
        proxy_request_buffering off;

        # 超时设置（压测/生产都要够大）
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # 关键：用 HTTP 转发到 Swow（不是 fastcgi）
        proxy_pass http://edge_auth_backend/mqtt/auth;

        # 健康检查端点
        proxy_next_upstream error timeout http_500 http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # 指标/健康端点（直接走 9503，不走负载均衡也行）
    location /metrics {
        proxy_pass http://127.0.0.1:9503/metrics;
        proxy_read_timeout 5s;
    }

    location /health {
        proxy_pass http://127.0.0.1:9503/health;
        proxy_read_timeout 5s;
    }

    # 拒绝其他路径
    location / {
        return 404;
    }
}
