# ===== TLS 监听器（单向 TLS，给 MQTTX 管理端用）=====
listeners.ssl {
  bind = "0.0.0.0:8883"
  keyfile  = "/etc/nanomq/certs/server.key"
  certfile = "/etc/nanomq/certs/server.crt"
  cacertfile = "/etc/nanomq/certs/ca.crt"
  verify_peer = false
  fail_if_no_peer_cert = false
}

# ===== 明文 TCP（给门禁用）=====
listeners.tcp {
  bind = "0.0.0.0:1883"
}

# ===== 会话安全 =====
mqtt.session {
  allow_anonymous = false
  max_packet_size = 1MB
  max_inflight = 32
}

# ===== 认证（门禁 + 管理端共用）=====
auth {
  allow_anonymous = false
  http {
    timeout = 5s
    connect_timeout = 3s
    retry_interval = 500ms
    retry_times = 3

    auth_req {
      url  = "https://ccs.dagasmart.com/admin-api/extension/edge/nano/auth"
      method = "post"
      headers = {
        content-type = "application/x-www-form-urlencoded"
      }
      params = {
        username = "%u"
        password = "%P"
        clientid = "%c"
        ipaddr   = "%a"
      }
    }
  }
#  password {
#    admin = "123456"
#    fxc = "123456"
#  }
}

# ===== 管理面关闭 =====
http_server {
  enable = false
}

# ===== 日志 =====
log {
  level = warn
}
